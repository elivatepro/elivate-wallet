name: Backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function and shared TypeScript
        run: |
          if [ -z "$(find src tests supabase/functions -name '*.ts' 2>/dev/null)" ]; then
            echo "No TypeScript sources yet; skipping."
          else
            deno task check
          fi

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Fresh replay, pgTAP and lint
        run: ./scripts/verify-database.sh
