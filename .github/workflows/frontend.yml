name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check (svelte-check)
        run: pnpm run check
      - name: Lint (prettier + eslint)
        run: pnpm run lint
      - name: Unit tests (Vitest)
        run: pnpm run test:unit
      - name: Build (adapter-cloudflare)
        run: pnpm run build
      # Bundles the Worker exactly as a deploy does (no upload, no account
      # needed), so a dependency that can't run in workerd fails here.
      - name: Worker bundle (wrangler dry run)
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler-dry
      # Blueprint 18: the same bundle deployed as the admin Worker.
      - name: Admin Worker bundle (wrangler dry run)
        run: pnpm exec wrangler deploy --dry-run --config wrangler.admin.jsonc --outdir .wrangler-dry-admin

  # Runs alongside `check` (both must pass); it doesn't need its output.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: E2E + axe against a fresh local Supabase stack
        run: ./scripts/e2e-local.sh
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
