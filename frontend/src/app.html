		<!-- Blueprint 35: launch animation (Paper "Install app v9" L02–L05). Installed app only,
		     once per session (the script below, allowed by its hash in vite.config.ts), never with
		     reduced motion. It starts from the phone's own still launch screen: #111314 with the
		     mark centred. -->
		<script data-launch>
			try {
				if (sessionStorage.getItem('ew:launched'))
					document.documentElement.classList.add('ew-launched');
				else sessionStorage.setItem('ew:launched', '1');
			} catch {
				document.documentElement.classList.add('ew-launched');
			}
		</script>
		<style>
			.ew-launch {
				display: none;
			}
			@media (display-mode: standalone) and (prefers-reduced-motion: no-preference) {
				html:not(.ew-launched) .ew-launch {
					position: fixed;
					inset: 0;
					z-index: 2147483647;
					display: flex;
					align-items: center;
					justify-content: center;
					background: #111314;
					pointer-events: none;
					animation: ew-launch-out 1200ms ease-in forwards;
				}
			}
			.ew-launch-bloom {
				position: absolute;
				width: 600px;
				height: 600px;
				border-radius: 50%;
				background: radial-gradient(closest-side, #ff7f4f4d 0%, #ff7f4f14 40%, #ff7f4f00 70%);
				opacity: 0;
				animation: ew-launch-bloom 1200ms ease-out forwards;
			}
			.ew-launch-ring {
				position: absolute;
				width: 220px;
				height: 220px;
				border: 1.5px solid #ff7f4f66;
				border-radius: 50%;
				opacity: 0;
				animation: ew-launch-ring 900ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
			}
			.ew-launch-mark {
				position: relative;
				width: 140px;
				height: 140px;
				animation: ew-launch-mark 1200ms cubic-bezier(0.3, 0.7, 0.2, 1) forwards;
			}
			.ew-launch-word {
				position: absolute;
				top: calc(50% + 34px);
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 6px;
				opacity: 0;
				animation: ew-launch-word 1200ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
			}
			.ew-launch-name {
				color: #f2f4f4;
				font:
					700 32px/36px 'Lexend Variable',
					'Lexend',
					system-ui,
					sans-serif;
				letter-spacing: -0.035em;
			}
			.ew-launch-by {
				color: #a9b0b3;
				font:
					400 12px/16px 'IBM Plex Mono',
					ui-monospace,
					monospace;
				letter-spacing: 0.14em;
			}
			@keyframes ew-launch-mark {
				0% {
					transform: none;
				}
				30% {
					transform: scale(1.1) rotate(-6deg);
				}
				65%,
				100% {
					transform: translateY(-36px) scale(0.74);
				}
			}
			@keyframes ew-launch-bloom {
				0% {
					opacity: 0;
					transform: scale(0.6);
				}
				30% {
					opacity: 1;
					transform: scale(1);
				}
				70%,
				100% {
					opacity: 0.5;
					transform: scale(1.05);
				}
			}
			@keyframes ew-launch-ring {
				0% {
					opacity: 0;
					transform: scale(0.64);
				}
				35% {
					opacity: 1;
				}
				100% {
					opacity: 0;
					transform: scale(1.5);
				}
			}
			@keyframes ew-launch-word {
				0%,
				35% {
					opacity: 0;
					transform: translateY(12px);
				}
				65%,
				100% {
					opacity: 1;
					transform: none;
				}
			}
			@keyframes ew-launch-out {
				0%,
				82% {
					opacity: 1;
					visibility: visible;
				}
				100% {
					opacity: 0;
					visibility: hidden;
				}
			}
		</style>
		%sveltekit.head%

	<body data-sveltekit-preload-data="hover">

			<div class="ew-launch-word">

				<span class="ew-launch-by">BY ELIVATE</span>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
