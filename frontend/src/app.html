<!doctype html>
<html lang="en" data-theme="%ew.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#111314" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
		<meta name="referrer" content="no-referrer" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/mark.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Elivate" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
