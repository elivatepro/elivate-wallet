<!doctype html>
<html lang="en" data-theme="%ew.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#111314" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
		<meta name="referrer" content="same-origin" />
		<meta
			name="description"
			content="Balances, income and withdrawals for your whole team, in one place. Sign in to your Elivate Wallet network."
		/>
		<meta name="application-name" content="Elivate Wallet" />
		<meta name="author" content="Elivate" />
		<meta name="format-detection" content="telephone=no" />
		<!-- Slice 33: link previews (WhatsApp, iMessage, Slack, LinkedIn, X…), Paper "Website" → OG — App preview. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Elivate Wallet" />
		<meta property="og:title" content="Elivate Wallet" />
		<meta
			property="og:description"
			content="A wallet that scales with your network. Balances, income and withdrawals for your whole team, in one place."
		/>
		<meta property="og:url" content="https://app.elivatewallet.com/" />
		<meta property="og:image" content="https://app.elivatewallet.com/og.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="Elivate Wallet: a wallet that scales with your network. Root, the plush piggy bank, sits on a stack of coins."
		/>
		<meta property="og:locale" content="en_NG" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Elivate Wallet" />
		<meta
			name="twitter:description"
			content="A wallet that scales with your network. Balances, income and withdrawals for your whole team, in one place."
		/>
		<meta name="twitter:image" content="https://app.elivatewallet.com/og.jpg" />
		<meta
			name="twitter:image:alt"
			content="Elivate Wallet: a wallet that scales with your network."
		/>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/icons/mark.svg" type="image/svg+xml" />
		<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Elivate" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
