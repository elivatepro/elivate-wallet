<!doctype html>
<html lang="en">

		<title>Offline · Elivate Wallet</title>
		<style>

				margin: 0;
				min-height: 100dvh;
				display: flex;

				color: #f2f4f4;

			<img src="/icons/mark.svg" alt="" width="40" height="40" />
