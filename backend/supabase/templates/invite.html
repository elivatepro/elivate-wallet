<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Your place on the team is ready.</title>
<style>
:root{color-scheme:light dark;supported-color-schemes:light dark}
body{margin:0;padding:0;-webkit-text-size-adjust:100%}
a.ew-button{mso-padding-alt:0}
@media (prefers-color-scheme:dark){
.ew-canvas{background:#111314!important}
.ew-card{background:#1A1D1E!important;border-color:#2A2F31!important}
.ew-text{color:#F2F4F4!important}
.ew-muted{color:#A9B0B3!important}
.ew-faint{color:#7D868A!important}
.ew-rule{border-top-color:#FFFFFF14!important}
.ew-tile{background:#F2F4F4!important;color:#111314!important}
}
[data-ogsc] .ew-canvas{background:#111314!important}
[data-ogsc] .ew-card{background:#1A1D1E!important;border-color:#2A2F31!important}
[data-ogsc] .ew-text{color:#F2F4F4!important}
[data-ogsc] .ew-muted{color:#A9B0B3!important}
[data-ogsc] .ew-faint{color:#7D868A!important}
@media (max-width:480px){
.ew-outer{padding:12px!important}
.ew-pad{padding-left:20px!important;padding-right:20px!important}
.ew-hero-wrap{padding-left:10px!important;padding-right:10px!important}
.ew-hero-copy{padding:18px!important;height:160px!important}
.ew-display{font-size:26px!important;line-height:30px!important}
.ew-root-cell{width:110px!important;padding-right:6px!important}
.ew-root{width:104px!important;height:140px!important}
.ew-button-table{width:100%!important}
.ew-headline{font-size:24px!important;line-height:30px!important}
.ew-button-cell{width:100%!important}
.ew-button{display:block!important;text-align:center!important}
}</style>
</head>
<body class="ew-canvas" style="margin:0;padding:0;background:#F7F6F3;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Accept to set up your Wallet.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="ew-canvas" style="background:#F7F6F3;">
<tr><td align="center" class="ew-outer" style="padding:24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="ew-card" style="max-width:552px;background:#FFFFFF;border:1px solid #D8DDDE;border-radius:16px;border-collapse:separate;">
<tr><td class="ew-pad" style="padding:22px 32px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td width="24" style="width:24px;"><img src="{{ .SiteURL }}/email/mark.png" width="24" height="24" alt="" style="display:block;border:0;"></td>
<td class="ew-text" style="padding-left:10px;font-family:Lexend,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:500;color:#212628;">Elivate Wallet</td>
</tr></table>
</td></tr>
<tr><td class="ew-hero-wrap" style="padding:0 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#1A1D1E" background="{{ .SiteURL }}/email/hero.jpg" style="background:#1A1D1E url('{{ .SiteURL }}/email/hero.jpg') 50% 50% / cover no-repeat;border-radius:14px;border-collapse:separate;">
<tr>
<td class="ew-hero-copy" valign="top" style="word-break:break-word;padding:24px;height:176px;">
<table role="presentation" width="100%" height="100%" cellpadding="0" cellspacing="0" border="0" style="height:100%;">
<tr><td valign="top"><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
<td style="background:#2C3133;border-radius:999px;padding:3px 10px;font-family:Lexend,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:16px;color:#D5DADB;">Invitation</td>
</tr></table></td></tr>
<tr><td valign="bottom">
<div class="ew-display" style="overflow-wrap:anywhere;word-break:break-word;font-family:Lexend,'Segoe UI',Helvetica,Arial,sans-serif;font-size:36px;line-height:42px;font-weight:600;letter-spacing:-0.02em;color:#FFFFFF;">You&#39;re invited</div><div style="padding-top:6px;word-break:break-all;overflow-wrap:anywhere;font-family:'IBM Plex Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:13px;line-height:16px;color:#A9B0B3;">{{ .Email }}</div>
</td></tr>
</table>
</td>
<td class="ew-root-cell" width="168" valign="bottom" align="right" style="width:168px;padding:0 12px 0 0;vertical-align:bottom;line-height:0;font-size:0;">
<img class="ew-root" src="{{ .SiteURL }}/email/root-invitation.png" width="156" height="210" alt="" style="display:block;border:0;width:156px;height:210px;">
</td>
</tr>
</table>
</td></tr>
<tr><td class="ew-pad" style="padding:28px 32px 32px;">
<h1 class="ew-text ew-headline" style="margin:0 0 12px;font-family:Lexend,'Segoe UI',Helvetica,Arial,sans-serif;font-size:26px;line-height:32px;font-weight:600;letter-spacing:-0.02em;color:#212628;">Your place on the team is ready.</h1>
<p class="ew-muted" style="margin:0 0 24px;font-family:Lexend,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:24px;color:#5E686B;">Accept to set up your Wallet.</p>
<table role="presentation" class="ew-button-table" cellpadding="0" cellspacing="0" border="0"><tr>
<td class="ew-button-cell" bgcolor="#FF7F4F" style="border-radius:999px;background:#FF7F4F;">
<a class="ew-button" href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;font-family:Lexend,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:600;color:#14100E;text-decoration:none;border-radius:999px;">Accept invitation</a>
</td>
</tr></table>
</td></tr>
<tr><td class="ew-pad ew-rule" style="padding:20px 32px 24px;border-top:1px solid #E6E9EA;">
<div class="ew-muted" style="font-family:Lexend,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#5E686B;padding-bottom:4px;">If you weren&#39;t expecting this, you can ignore this email.</div><div class="ew-faint" style="font-family:Lexend,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#8A9396;">Wallet by Elivate</div>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
